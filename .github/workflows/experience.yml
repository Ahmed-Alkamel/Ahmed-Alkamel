name: Update Experience Years

on:
  schedule:
    # يعمل تلقائياً في اليوم الأول من كل عام
    - cron: '0 0 1 1 *'
  workflow_dispatch: # زر التشغيل اليدوي للتجربة

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Calculate Experience and Update README
        run: |
          # 1. حساب سنوات الخبرة
          CURRENT_YEAR=$(date +'%Y')
          START_YEAR=2022
          EXPERIENCE=$((CURRENT_YEAR - START_YEAR))
          
          # 2. تحديث الرقم في الصورة المتحركة (Typing SVG)
          sed -i -E "s/[0-9]+(%2B\+Years\+Experience)/${EXPERIENCE}\1/g" README.md
          
          # 3. تحديث الرقم في قسم النبذة (About Me)
          sed -i -E "s/\*\*[0-9]+\+ years of experience\*\*/\*\*${EXPERIENCE}\+ years of experience\*\*/g" README.md
          
          # 4. تحديث الرقم في بطاقة الإحصائيات (Quick Stats)
          sed -i -E "s/Experience-[0-9]+(%2B%20Years)/Experience-${EXPERIENCE}\1/g" README.md

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          # سيقوم بالرفع فقط إذا كان هناك تغيير فعلي في الرقم
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update years of experience to ${EXPERIENCE}"
          git push
